name: ezeffero
channels:
  - conda-forge
dependencies:
  # Cellpose 3.x/4.x supports Python 3.10 or 3.11; keep this below 3.12.
  - python=3.11
  - pip
  - pip:
      - numpy>=1.24
      - pandas>=2.0
      - pillow>=10.0
      - scikit-image>=0.21
      - matplotlib>=3.7
      - scipy>=1.10
      - pyyaml>=6.0
      - opencv-python-headless>=4.8
      # Match the WSL NVIDIA driver reported by nvidia-smi (CUDA 12.4).
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - "cellpose[gui]>=3.0"
